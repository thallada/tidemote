# Experiment (branch ci/windows-gpu only): what WebGPU the Windows runner offers the packaged app under each of
# several sets of switches (desktop/scripts/gpu-probe.mjs), toward a launch check that needs a GPU on Windows as
# it does on Linux and macOS. Never ships anything.
name: Windows GPU probe

on:
  push:
    branches: [ci/windows-gpu]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      OUT: desktop/out/Tidemote-win32-x64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: actions/cache@v5
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - name: Package
        working-directory: desktop
        run: |
          node scripts/stage.mjs
          node scripts/package.mjs --platform win32 --arch x64
      - name: The runner's display adapters
        shell: pwsh
        run: Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, PNPDeviceID, Status | Out-String | ForEach-Object { Write-Output "::notice title=video controllers::$($_ -replace "`r?`n", '%0A')" }
      - name: GPU probe
        run: node desktop/scripts/gpu-probe.mjs --exe "$OUT/Tidemote.exe" --out gpu-probe
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-probe
          path: gpu-probe/
          if-no-files-found: ignore

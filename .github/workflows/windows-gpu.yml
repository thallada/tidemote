# Experiment (branch ci/windows-gpu only): what WebGPU the Windows runner offers the packaged app under each of
# several sets of switches (desktop/scripts/gpu-probe.mjs), toward a launch check that needs a GPU on Windows as
# it does on Linux and macOS. Never ships anything.
name: Windows GPU probe

on:
  push:
    branches: [ci/windows-gpu]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      OUT: desktop/out/Tidemote-win32-x64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: actions/cache@v5
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - name: Package
        working-directory: desktop
        run: |
          node scripts/stage.mjs
          node scripts/package.mjs --platform win32 --arch x64
      - name: The runner's display adapters
        shell: pwsh
        run: Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, PNPDeviceID, Status | Out-String | ForEach-Object { Write-Output "::notice title=video controllers::$($_ -replace "`r?`n", '%0A')" }
      - name: GPU probe
        run: PROBE_WAIT=90000 PROBE_SETS='[["--ignore-gpu-blocklist"],["--ignore-gpu-blocklist","--disable-gpu-watchdog"],["--ignore-gpu-blocklist","--use-webgpu-adapter=swiftshader"],["--ignore-gpu-blocklist","--use-webgpu-adapter=swiftshader","--disable-gpu-watchdog"]]' node desktop/scripts/gpu-probe.mjs --exe "$OUT/Tidemote.exe" --out gpu-probe
      - name: Launch check
        if: always()
        run: node desktop/scripts/launch-check.mjs --exe "$OUT/Tidemote.exe" --out launch-windows --need-gpu --summary "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-probe
          path: |
            gpu-probe/
            launch-windows/
          if-no-files-found: ignore
